<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>STI College Baliuag — Virtual Admission Kiosk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              kiosk: {
                header: "#001a99",
                page: "#e1f5fe",
              },
            },
            fontFamily: {
              poppins: ["Poppins", "system-ui", "sans-serif"],
            },
            boxShadow: {
              card: "0 10px 24px rgba(0,0,0,0.08), 0 2px 6px rgba(0,0,0,0.04)",
            },
          },
        },
      };
    </script>
  </head>
  <body
    class="m-0 min-h-screen flex flex-col font-poppins bg-kiosk-page text-gray-800"
  >
    <!-- Header -->
    <header
      class="flex flex-col items-center justify-center bg-[#001a99] text-white py-8 shrink-0"
    >
      <h1 class="text-[40px] font-bold leading-tight text-center">
        STI College Baliuag
      </h1>
      <p class="text-[24px] font-normal leading-snug mt-1.5 text-center">
        Virtual Admission Kiosk
      </p>
    </header>

    <!-- Main: centered card (500×620) -->
    <main class="flex-1 flex items-center justify-center px-6 py-10">
      <div
        class="bg-white rounded-2xl shadow-card w-[500px] h-[620px] shrink-0 px-10 pt-[50px] pb-9 flex flex-col text-center box-border"
      >
        <h2 class="text-[40px] font-bold text-gray-800 leading-tight">
          Scan your RFID
        </h2>
        <p class="text-[20px] text-gray-500 mt-3 leading-relaxed max-w-xs mx-auto">
          Place your student ID card on the RFID scanner
        </p>

        <div class="flex-1 flex items-center justify-center min-h-0 mt-2">
          <img
            src="../assets/images/scanner_logo.png"
            alt="RFID scanner symbol"
            width="170"
            height="170"
            class="w-[170px] h-[170px] object-contain shrink-0"
          />
        </div>
      </div>
    </main>
  </body>
</html>
