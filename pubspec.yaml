name: capstone_dashboard
description: "Flutter admin dashboard UI with Supabase-ready setup."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_dotenv: ^5.2.1
  google_fonts: ^6.2.1
  supabase_flutter: ^2.6.0
  kiosk:
    path: packages/kiosk_home
  student_kiosk_module:
    path: packages/student_kiosk_module

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
