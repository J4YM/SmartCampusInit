name: capstone_dashboard
description: "Flutter admin dashboard UI with Supabase-ready setup."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_dotenv: ^5.2.1
  google_fonts: ^6.2.1
  http: ^1.2.2
  supabase_flutter: ^2.6.0
  printing: ^5.14.3
  pdf: ^3.12.0
  docx_creator: ^1.3.2
  file_picker: ^11.0.2
  uuid: ^4.4.0
  qr_flutter: ^4.1.0
  login_module:
    path: packages/login_module
  rfid_management_module:
    path: packages/rfid_management_module
  virtual_admission_slip:
    path: packages/virtual_admission_slip
  admin_dashboard:
    path: packages/admin_dashboard
  dashboard_layout:
    path: packages/dashboard_layout
  discipline_officer_module:
    path: packages/discipline_officer_module
  guidance_counselor_module:
    path: packages/guidance_counselor_module
  professor_module:
    path: packages/professor_module
  kiosk:
    path: packages/kiosk_home
  student_kiosk_module:
    path: packages/student_kiosk_module

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
