name: capstone_dashboard
description: "Flutter admin dashboard UI with Supabase-ready setup."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_dotenv: ^5.2.1
  google_fonts: ^6.2.1
  http: ^1.2.2
  supabase_flutter: ^2.6.0
  printing: ^5.14.3
  pdf: ^3.12.0
  docx_creator: ^1.3.2
  file_picker: ^11.0.2
  uuid: ^4.4.0
  qr_flutter: ^4.1.0
  camera: ^0.11.0+2
  # Windows isn't an "endorsed" federated implementation of `camera` — must
  # be listed explicitly or the Windows build has no camera backend at all.
  # Pinned to 0.2.6+2, not the latest 0.2.6+5: +3/+4/+5 are maintenance-only
  # (Pigeon regeneration, an SDK-constraint bump, dead example code — no
  # functional camera changes), but +3 raises the minimum Dart SDK to
  # ^3.8.0 and +5 to ^3.10.0, both above Netlify's pinned Flutter 3.24.5
  # (Dart 3.5.4 — see scripts/netlify_build.sh). 0.2.6+2 is the newest
  # version still on Dart ^3.4.0, which 3.5.4 satisfies.
  camera_windows: 0.2.6+2
  login_module:
    path: packages/login_module
  rfid_management_module:
    path: packages/rfid_management_module
  virtual_admission_slip:
    path: packages/virtual_admission_slip
  admin_dashboard:
    path: packages/admin_dashboard
  dashboard_layout:
    path: packages/dashboard_layout
  discipline_officer_module:
    path: packages/discipline_officer_module
  guidance_counselor_module:
    path: packages/guidance_counselor_module
  professor_module:
    path: packages/professor_module
  registrar_module:
    path: packages/registrar_module
  kiosk:
    path: packages/kiosk_home
  student_kiosk_module:
    path: packages/student_kiosk_module

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

dependency_overrides:
  # Flutter 3.24.5's bundled flutter_test pins path to exactly 1.9.0, while
  # docx_creator ^1.3.2 requires path ^1.9.1 — an unsolvable constraint
  # without this override. 1.9.1's only changes are an SDK constraint bump
  # and a repo move (no API/behavior changes), so pinning to 1.9.0 is safe.
  path: 1.9.0
  # Same issue: flutter_test pins vector_math to exactly 2.1.4, while pdf
  # ^3.12.0 actually calls vector_math 2.2.0's typed Matrix4 methods
  # (translateByDouble/scaleByDouble/leftTranslateByDouble), so pinning
  # down to 2.1.4 breaks the pdf package at compile time. flutter_test
  # (a dev-only dependency) doesn't call into vector_math itself, so
  # overriding up to 2.2.0 — the highest version still on Dart ^3.1.0,
  # compatible with Flutter 3.24.5's Dart 3.5.4 — satisfies pdf's real
  # requirement without breaking tests.
  vector_math: 2.2.0
  # docx_creator 1.3.2 (transitively) requires markdown ^7.3.1, whose only
  # SDK bump is to Dart ^3.9.0 as a maintenance formality — its actual
  # changes are bug fixes/deprecations (see its changelog), not anything
  # requiring Dart 3.9 syntax. Flutter 3.24.5 bundles Dart 3.5.4, so pin to
  # 7.3.0, the version docx_creator targeted immediately prior.
  markdown: 7.3.0
  # docx_creator 1.3.2 also (transitively) requires xml ^6.6.1, which bumped
  # to Dart ^3.8.0 (also incompatible with Flutter 3.24.5's Dart 3.5.4).
  # Pin to 6.5.0, the last version on the Dart ^3.2.0 constraint.
  xml: 6.5.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/sti_logo.png
