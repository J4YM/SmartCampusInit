# Netlify: Flutter web — see scripts/netlify_build.sh
# Set in Netlify UI → Site configuration → Environment variables (for builds):
#   SUPABASE_URL       = https://xxxx.supabase.co
#   SUPABASE_ANON_KEY  = your anon public key
# Optional:
#   PROFILE_ROLE_STUDENT = Student
#   ML_API_BASE_URL      = deployed dropout-risk ML service base URL
#   ML_RETRAIN_API_KEY   = X-API-Key for that service's /retrain endpoint
#   FLUTTER_TARBALL      = override Flutter Linux SDK URL if needed

[build]
  command = "chmod +x scripts/netlify_build.sh && ./scripts/netlify_build.sh"
  publish = "build/web"

[build.environment]
  GIT_SUBMODULE_STRATEGY = "none"
